# Account server for Hanna's Reading List: PocketBase behind Tailscale Funnel.
# Setup steps: deploy/nas/README.md
#
# Replace /mnt/POOL/apps/reading-list with the path of your dataset, and the
# auth key with your own. PocketBase listens on 127.0.0.1 inside the shared
# network namespace, so the only way in is through Tailscale.

services:
  tailscale:
    image: ghcr.io/tailscale/tailscale:v1.104.4
    hostname: reading-list
    environment:
      TS_HOSTNAME: reading-list
      # only used the first time; the login is kept in the state folder afterwards
      TS_AUTHKEY: tskey-auth-REPLACE-ME
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
    volumes:
      - /mnt/POOL/apps/reading-list/tailscale:/var/lib/tailscale
      - /mnt/POOL/apps/reading-list/serve.json:/config/serve.json:ro
    restart: unless-stopped

  pocketbase:
    image: ghcr.io/muchobien/pocketbase:0.40.6
    network_mode: service:tailscale
    depends_on:
      - tailscale
    command:
      - serve
      - --http=127.0.0.1:8090
      - --dir=/pb_data
      - --migrationsDir=/pb_migrations
      # the schema comes from this repo's migrations, not from edits in the admin screen
      - --automigrate=false
    volumes:
      - /mnt/POOL/apps/reading-list/pb_data:/pb_data
      - /mnt/POOL/apps/reading-list/pb_migrations:/pb_migrations:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8090/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
