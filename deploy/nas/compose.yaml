# Account server for Hanna's Reading List: PocketBase behind Tailscale Funnel.
# Setup steps: deploy/nas/README.md
#
# Replace /mnt/POOL/apps/reading-list with the path of your dataset, and the
# auth key with your own. PocketBase listens on 127.0.0.1 inside the shared
# network namespace, so the only way in is through Tailscale.
#
# Deploys: GitHub Actions publishes the PocketBase image (with the schema
# built in) as :stable. Watchtower checks for a new one every 5 minutes and
# restarts only the pocketbase container with it.

services:
  tailscale:
    image: ghcr.io/tailscale/tailscale:v1.104.4
    hostname: reading-list
    environment:
      TS_HOSTNAME: reading-list
      # only used the first time; the login is kept in the state folder afterwards
      TS_AUTHKEY: tskey-auth-REPLACE-ME
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
    volumes:
      - /mnt/POOL/apps/reading-list/tailscale:/var/lib/tailscale
      - /mnt/POOL/apps/reading-list/serve.json:/config/serve.json:ro
    restart: unless-stopped

  pocketbase:
    # built from deploy/nas/Dockerfile by .github/workflows/backend.yml
    image: ghcr.io/sandergeraedts/reading-list-pocketbase:stable
    network_mode: service:tailscale
    depends_on:
      - tailscale
    command:
      - serve
      - --http=127.0.0.1:8090
      - --dir=/pb_data
      - --migrationsDir=/pb_migrations
      - --hooksDir=/pb_hooks
      # the schema comes from this repo's migrations, not from edits in the admin screen
      - --automigrate=false
    environment:
      # who may create an account in the app, comma-separated; empty = nobody
      SIGNUP_EMAILS: hanna@example.com
    volumes:
      - /mnt/POOL/apps/reading-list/pb_data:/pb_data
    labels:
      # the only container Watchtower may update
      com.centurylinklabs.watchtower.enable: "true"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8090/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  watchtower:
    # maintained fork of containrrr/watchtower (archived December 2025)
    image: nickfedor/watchtower:1.23.2
    environment:
      # only containers labelled com.centurylinklabs.watchtower.enable=true
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_POLL_INTERVAL: "300"
      # remove the previous image after updating
      WATCHTOWER_CLEANUP: "true"
      TZ: Europe/Amsterdam
    volumes:
      # needed to pull images and restart the pocketbase container
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
